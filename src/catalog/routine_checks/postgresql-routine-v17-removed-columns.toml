# Routine check postgresql-routine-v17-removed-columns (#1951). Fields: src/shared/catalog/routine_checks.py.
# Source: PostgreSQL 17 release notes, Migration to Version 17 (checkpoint columns moved from pg_stat_bgwriter to pg_stat_checkpointer; buffers_backend and buffers_backend_fsync removed, see pg_stat_io).
id = "postgresql-routine-v17-removed-columns"
feature = "A pg_stat_bgwriter column PostgreSQL 17 moved or removed"
source_engines = ["postgresql"]
targets = ["aurora_postgresql"]
kinds = ["function", "procedure"]
impact = "needs_rewrite"
reason = "PostgreSQL 17 moved pg_stat_bgwriter's checkpoint columns to the new pg_stat_checkpointer view and removed buffers_backend and buffers_backend_fsync, so on Aurora PostgreSQL 17 and later the query fails with an unknown column."
fix_hint = "Read the checkpoint figures from pg_stat_checkpointer (num_timed, num_requested, write_time, sync_time, buffers_written) and the backend writes from pg_stat_io."
docs = "PostgreSQL 17 release notes, Migration to Version 17"

[version_change]
line = "17"

[match]
catalog_columns = [
  "pg_stat_bgwriter.checkpoints_timed", "pg_stat_bgwriter.checkpoints_req",
  "pg_stat_bgwriter.checkpoint_write_time", "pg_stat_bgwriter.checkpoint_sync_time",
  "pg_stat_bgwriter.buffers_checkpoint", "pg_stat_bgwriter.buffers_backend",
  "pg_stat_bgwriter.buffers_backend_fsync",
]
